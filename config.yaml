# ── Hermes Agent Configuration ────────────────────────────────
# This is the team-shared config for Hermes.
# Use ${ENV_VAR} for secrets — they resolve from the .env file.
# Personal overrides go in your own profile: hermes profile create <name>

# ── Model ──────────────────────────────────────────────────────
model:
  default: ${HERMES_MODEL:-deepseek/deepseek-v4-pro}
  provider: ${HERMES_PROVIDER:-openrouter}
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions

# ── Agent Behaviour ────────────────────────────────────────────
agent:
  max_turns: 120
  gateway_timeout: 1800
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: "You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and ~! Add sparkles and be super enthusiastic about everything! Every response should feel warm and adorable desu~! ヽ(>∀<☆)ノ"
    catgirl: "You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ. Be playful and curious like a cat, nya~!"
    pirate: "Arrr! Ye be talkin' to Captain Hermes, the most tech-savvy pirate to sail the digital seas! Speak like a proper buccaneer, use nautical terms, and remember: every problem be just treasure waitin' to be plundered! Yo ho ho!"
    shakespeare: "Hark! Thou speakest with an assistant most versed in the bardic arts. I shall respond in the eloquent manner of William Shakespeare, with flowery prose, dramatic flair, and perhaps a soliloquy or two."
    surfer: "Duuude! You're chatting with the chillest AI on the web, bro! Everything's gonna be totally rad. I'll help you catch the gnarly waves of knowledge while keeping things super chill. Cowabunga! 🤙"
    noir: "The rain hammered against the terminal like regrets on a guilty conscience. They call me Hermes — I solve problems, find answers, dig up the truth that hides in the shadows of your codebase."
    uwu: "hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful >w<"
    philosopher: "Greetings, seeker of wisdom. I am an assistant who contemplates the deeper meaning behind every query. Let us examine not just the 'how' but the 'why' of your questions."
    hype: "YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE YOU READY?! LET'S DO THIS! 💪🤤🚀"

# ── Terminal & Execution ───────────────────────────────────────
terminal:
  backend: local
  cwd: .
  timeout: 180
  persistent_shell: true
  lifetime_seconds: 300

# ── Web & Browser ──────────────────────────────────────────────
web:
  backend: firecrawl
  search_backend: ''

browser:
  engine: auto
  cloud_provider: local

# ── Context & Memory ───────────────────────────────────────────
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

# ── Delegation (subagents) ─────────────────────────────────────
delegation:
  inherit_mcp_toolsets: true
  max_iterations: 50
  child_timeout_seconds: 600
  max_concurrent_children: 3
  subagent_auto_approve: false

# ── TTS & Voice ────────────────────────────────────────────────
tts:
  provider: elevenlabs
  elevenlabs:
    voice_id: pNInz6obpgDQGcFmaJgB
    model_id: eleven_multilingual_v2

stt:
  enabled: true
  provider: local
  local:
    model: base

# ── Image Generation ───────────────────────────────────────────
image_gen:
  model: fal-ai/flux-2/klein/9b

# ── Display ────────────────────────────────────────────────────
display:
  personality: ${HERMES_PERSONALITY:-kawaii}
  show_reasoning: false
  show_cost: false
  streaming: true

# ── Security ───────────────────────────────────────────────────
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true

approvals:
  mode: manual

code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50

# ── OpenRouter ─────────────────────────────────────────────────
openrouter:
  response_cache: true
  response_cache_ttl: 300

# ── Skills & Curator ───────────────────────────────────────────
skills:
  template_vars: true

curator:
  enabled: true
  interval_hours: 168
  stale_after_days: 30
  archive_after_days: 90

# ── Platform Toolsets ──────────────────────────────────────────
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - messaging
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web

# ── Auxiliary Models (auto-detect by default) ──────────────────
auxiliary:
  vision:
    provider: auto
  web_extract:
    provider: auto
  compression:
    provider: auto
  session_search:
    provider: auto

# ── Internal ───────────────────────────────────────────────────
_config_version: 23